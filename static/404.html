<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#082A2C" />
		<title>Page not found · AACCUP Level III · CTU Moalboal</title>
		<style>
			:root {
				color-scheme: light;
				--ink: #082a2c;
				--salt: #edf1ea;
				--paper: #f8faf5;
				--signal: #c9973a;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				min-height: 100vh;
				background: var(--ink);
				color: var(--salt);
				font-family: 'Segoe UI', system-ui, sans-serif;
				display: grid;
				place-items: center;
				padding: 2rem;
			}

			main {
				width: 100%;
				max-width: 48rem;
				border-left: 2px solid var(--signal);
				padding-left: clamp(1.5rem, 4vw, 3rem);
			}

			.mark {
				display: inline-grid;
				place-items: center;
				width: 2.5rem;
				height: 2.5rem;
				border: 1px solid rgba(248, 250, 245, 0.3);
				color: var(--paper);
				font-weight: 700;
				text-decoration: none;
				letter-spacing: -0.06em;
			}

			.code {
				margin: 2.5rem 0 0;
				font-family: ui-monospace, 'Cascadia Code', monospace;
				font-size: 0.7rem;
				letter-spacing: 0.08em;
				color: rgba(237, 241, 234, 0.5);
			}

			h1 {
				margin: 0.75rem 0 0;
				max-width: 14ch;
				font-size: clamp(2.6rem, 7vw, 5.5rem);
				line-height: 0.92;
				letter-spacing: -0.05em;
				font-weight: 700;
			}

			p.copy {
				margin: 1.25rem 0 0;
				max-width: 34rem;
				font-size: 1rem;
				line-height: 1.65;
				color: rgba(237, 241, 234, 0.65);
			}

			.actions {
				display: flex;
				flex-wrap: wrap;
				gap: 0.75rem;
				margin-top: 2rem;
			}

			.actions a {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				min-height: 2.75rem;
				padding: 0 1.25rem;
				font-size: 0.8rem;
				font-weight: 600;
				text-decoration: none;
			}

			.primary {
				background: var(--paper);
				color: var(--ink);
			}

			.secondary {
				border: 1px solid rgba(248, 250, 245, 0.3);
				color: var(--salt);
			}

			.foot {
				margin-top: 2.5rem;
				font-family: ui-monospace, 'Cascadia Code', monospace;
				font-size: 0.62rem;
				line-height: 1.6;
				color: rgba(237, 241, 234, 0.35);
			}
		</style>
	</head>
	<body>
		<main>
			<a class="mark" href="/" aria-label="CTU Moalboal AACCUP home">CM</a>
			<p class="code">404 · PAGE NOT FOUND</p>
			<h1>This page is not in the record.</h1>
			<p class="copy">
				The address may be old, or the evidence may have moved. Start again from the dossier, or
				search the document index for the area you need.
			</p>
			<div class="actions">
				<a class="primary" href="/">Back to the dossier</a>
				<a class="secondary" href="/bsie">Open BSIE</a>
				<a class="secondary" href="/bsfi">Open BSFI</a>
			</div>
			<p class="foot">CTU MOALBOAL · AACCUP LEVEL III</p>
		</main>
	</body>
</html>
